<svg width="800" height="290" viewBox="0 0 800 290" xmlns="http://www.w3.org/2000/svg">
  <rect x="0" y="0" width="800" height="290" rx="10" fill="#0A0A0A" stroke="#2A2A2A" stroke-width="1"/>

  <!-- title bar -->
  <rect x="0" y="0" width="800" height="34" rx="10" fill="#141414"/>
  <rect x="0" y="24" width="800" height="10" fill="#141414"/>
  <circle cx="24" cy="17" r="6" fill="#FF5F56"/>
  <circle cx="44" cy="17" r="6" fill="#FFBD2E"/>
  <circle cx="64" cy="17" r="6" fill="#27C93F"/>
  <text x="400" y="21" font-family="'JetBrains Mono', monospace" font-size="12" fill="#6A6A6A" text-anchor="middle">
    Leet_V@github: ~/profile
  </text>

  <!-- line 1: $ whoami (static accent) + npx leet-v (typed once) -->
  <text x="28" y="70" font-family="'JetBrains Mono', monospace" font-size="15" fill="rgb(81,137,245)">$ whoami</text>

  <text x="110" y="70" font-family="'JetBrains Mono', monospace" font-size="15" fill="#FFFFFF">npm run leet:v</text>
  <rect x="110" y="56" width="115" height="20" fill="#0A0A0A">
    <animate attributeName="x" from="110" to="225" begin="0.2s" dur="0.8s" fill="freeze" repeatCount="1" restart="whenNotActive"/>
    <animate attributeName="width" from="115" to="0" begin="0.2s" dur="0.8s" fill="freeze" repeatCount="1" restart="whenNotActive"/>
  </rect>

  <!-- output lines: quick dim-gray appear, then one by one turn solid (white / accent for last) -->
  <text x="28" y="104" font-family="'JetBrains Mono', monospace" font-size="15" fill="#8A8A8A" opacity="0">
    Hi, I'm Vasiliy 👋
    <animate attributeName="opacity" from="0" to="0.5" begin="1.1s" dur="0.15s" fill="freeze" repeatCount="1" restart="whenNotActive"/>
    <animate attributeName="opacity" from="0.5" to="1" begin="1.8s" dur="0.3s" fill="freeze" repeatCount="1" restart="whenNotActive"/>
    <animate attributeName="fill" from="#8A8A8A" to="#FFFFFF" begin="1.8s" dur="0.3s" fill="freeze" repeatCount="1" restart="whenNotActive"/>
  </text>

  <text x="28" y="132" font-family="'JetBrains Mono', monospace" font-size="15" fill="#8A8A8A" opacity="0">
    Web developer, 8+ years (PHP / Laravel / Vue)
    <animate attributeName="opacity" from="0" to="0.5" begin="1.2s" dur="0.15s" fill="freeze" repeatCount="1" restart="whenNotActive"/>
    <animate attributeName="opacity" from="0.5" to="1" begin="2.0s" dur="0.3s" fill="freeze" repeatCount="1" restart="whenNotActive"/>
    <animate attributeName="fill" from="#8A8A8A" to="#FFFFFF" begin="2.0s" dur="0.3s" fill="freeze" repeatCount="1" restart="whenNotActive"/>
  </text>

  <text x="28" y="160" font-family="'JetBrains Mono', monospace" font-size="15" fill="#8A8A8A" opacity="0">
    Built admin panels, e-commerce, and payment flows
    <animate attributeName="opacity" from="0" to="0.5" begin="1.3s" dur="0.15s" fill="freeze" repeatCount="1" restart="whenNotActive"/>
    <animate attributeName="opacity" from="0.5" to="1" begin="2.2s" dur="0.3s" fill="freeze" repeatCount="1" restart="whenNotActive"/>
    <animate attributeName="fill" from="#8A8A8A" to="#FFFFFF" begin="2.2s" dur="0.3s" fill="freeze" repeatCount="1" restart="whenNotActive"/>
  </text>

  <text x="28" y="188" font-family="'JetBrains Mono', monospace" font-size="15" fill="#8A8A8A" opacity="0">
    Now focused on: JavaScript, React, TypeScript
    <animate attributeName="opacity" from="0" to="0.5" begin="1.4s" dur="0.15s" fill="freeze" repeatCount="1" restart="whenNotActive"/>
    <animate attributeName="opacity" from="0.5" to="1" begin="2.4s" dur="0.3s" fill="freeze" repeatCount="1" restart="whenNotActive"/>
    <animate attributeName="fill" from="#8A8A8A" to="#FFFFFF" begin="2.4s" dur="0.3s" fill="freeze" repeatCount="1" restart="whenNotActive"/>
  </text>

  <!-- last line: whole line fades/lightens to white, but the "frontend" tspan overrides to accent blue -->
  <text x="28" y="216" font-family="'JetBrains Mono', monospace" font-size="15" fill="#8A8A8A" opacity="0">
    <tspan>Open to </tspan><tspan fill="#8A8A8A">frontend<animate attributeName="fill" from="#8A8A8A" to="rgb(81,137,245)" begin="2.6s" dur="0.3s" fill="freeze" repeatCount="1" restart="whenNotActive"/></tspan><tspan> roles ✌️</tspan>
    <animate attributeName="opacity" from="0" to="0.5" begin="1.5s" dur="0.15s" fill="freeze" repeatCount="1" restart="whenNotActive"/>
    <animate attributeName="opacity" from="0.5" to="1" begin="2.6s" dur="0.3s" fill="freeze" repeatCount="1" restart="whenNotActive"/>
    <animate attributeName="fill" from="#8A8A8A" to="#FFFFFF" begin="2.6s" dur="0.3s" fill="freeze" repeatCount="1" restart="whenNotActive"/>
  </text>

  <!-- final line: $ + blinking cursor (only element that keeps animating) -->
  <text x="28" y="250" font-family="'JetBrains Mono', monospace" font-size="15" fill="rgb(81,137,245)" opacity="0">
    $
    <animate attributeName="opacity" from="0" to="1" begin="2.9s" dur="0.01s" fill="freeze" repeatCount="1" restart="whenNotActive"/>
  </text>

  <rect x="42" y="237" width="9" height="16" fill="rgb(81,137,245)" opacity="0">
    <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.4;0.4;0.9;1" dur="1s" begin="2.9s" repeatCount="indefinite" restart="whenNotActive"/>
  </rect>
</svg>