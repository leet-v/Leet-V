<svg width="800" height="140" viewBox="0 0 800 140" xmlns="http://www.w3.org/2000/svg">
    <defs>
        <radialGradient id="glow" cx="50%" cy="40%" r="60%">
            <stop offset="0%" stop-color="rgb(81,137,245)" stop-opacity="0.35"/>
            <stop offset="100%" stop-color="rgb(81,137,245)" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="cardBorder" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="rgb(81,137,245)" stop-opacity="0.55"/>
            <stop offset="100%" stop-color="rgb(81,137,245)" stop-opacity="0.08"/>
        </linearGradient>
    </defs>

    <!-- 1: Claude Code -->
    <g transform="translate(100,16)">
        <rect x="0" y="0" width="64" height="64" rx="14" fill="#111214"/>
        <rect x="0" y="0" width="64" height="64" rx="14" fill="none" stroke="url(#cardBorder)" stroke-width="1.5"/>
        <circle cx="32" cy="30" r="26" fill="url(#glow)"/>
        <path d="M20 22 L32 32 L20 42" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        <line x1="36" y1="42" x2="46" y2="42" stroke="rgb(81,137,245)" stroke-width="3" stroke-linecap="round"/>
        <text x="32" y="94" font-family="'JetBrains Mono', monospace" font-size="12" fill="#A3A3A3" text-anchor="middle">Claude Code</text>
    </g>

    <!-- 2: MCP -->
    <g transform="translate(300,16)">
        <rect x="0" y="0" width="64" height="64" rx="14" fill="#111214"/>
        <rect x="0" y="0" width="64" height="64" rx="14" fill="none" stroke="url(#cardBorder)" stroke-width="1.5"/>
        <circle cx="32" cy="30" r="26" fill="url(#glow)"/>
        <line x1="24" y1="18" x2="24" y2="26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
        <line x1="40" y1="18" x2="40" y2="26" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round"/>
        <path d="M18 26 H46 V34 A14 14 0 0 1 18 34 Z" fill="#FFFFFF"/>
        <line x1="32" y1="48" x2="32" y2="40" stroke="rgb(81,137,245)" stroke-width="3" stroke-linecap="round"/>
        <text x="32" y="94" font-family="'JetBrains Mono', monospace" font-size="12" fill="#A3A3A3" text-anchor="middle">MCP</text>
    </g>

    <!-- 3: Skills -->
    <g transform="translate(500,16)">
        <rect x="0" y="0" width="64" height="64" rx="14" fill="#111214"/>
        <rect x="0" y="0" width="64" height="64" rx="14" fill="none" stroke="url(#cardBorder)" stroke-width="1.5"/>
        <circle cx="32" cy="30" r="26" fill="url(#glow)"/>
        <path d="M32 14 L48 23 L32 32 L16 23 Z" fill="#FFFFFF"/>
        <path d="M16 32 L32 41 L48 32" fill="none" stroke="rgb(81,137,245)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.85"/>
        <path d="M16 41 L32 50 L48 41" fill="none" stroke="rgb(81,137,245)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.55"/>
        <text x="32" y="94" font-family="'JetBrains Mono', monospace" font-size="12" fill="#A3A3A3" text-anchor="middle">Skills</text>
    </g>

    <!-- 4: Agents -->
    <g transform="translate(700,16)">
        <rect x="0" y="0" width="64" height="64" rx="14" fill="#111214"/>
        <rect x="0" y="0" width="64" height="64" rx="14" fill="none" stroke="url(#cardBorder)" stroke-width="1.5"/>
        <circle cx="32" cy="30" r="26" fill="url(#glow)"/>
        <line x1="32" y1="10" x2="32" y2="17" stroke="rgb(81,137,245)" stroke-width="3" stroke-linecap="round"/>
        <circle cx="32" cy="8" r="3" fill="rgb(81,137,245)"/>
        <rect x="16" y="17" width="32" height="26" rx="8" fill="#FFFFFF"/>
        <circle cx="25" cy="30" r="3" fill="#111214"/>
        <circle cx="39" cy="30" r="3" fill="#111214"/>
        <text x="32" y="94" font-family="'JetBrains Mono', monospace" font-size="12" fill="#A3A3A3" text-anchor="middle">Agents</text>
    </g>
